# Bu makinede yaklaşık 8 GB RAM var. 8G heap + 4G metaspace native belleği
# tüketip Gradle JVM'inin çökmesine neden oluyordu (hs_err: G1 virtual space).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# Windows: aynı anda birden fazla Gradle görevi classes.dex üzerinde dosya kilidine takılabiliyor.
org.gradle.parallel=false
# PathExistsException (errno 183) riskini azaltmak için tek worker.
org.gradle.workers.max=1

# Gradle daemon bazı ortamlarda Eclipse Adoptium java.exe için CreateProcess error=5 (Erişim engellendi)
# üretebiliyor; Android Studio JBR ile genelde sorun kalkar. Yolu kendi kurulumunuza göre güncelleyin.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
